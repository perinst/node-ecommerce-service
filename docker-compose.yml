version: '3.8'

services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pershop-api-1
    ports:
      - "3887:3888"
    environment:
      - PORT_REST_FULL=3887
      - URL_MONGO_DATABASE_LOCAL=${URL_MONGO_DATABASE_LOCAL}
      - URL_SERVER=${URL_SERVER}
    networks:
      - pershop_network

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pershop-api-2
    ports:
      - "3888:3888"
    environment:
      - PORT_REST_FULL=3888
      - URL_MONGO_DATABASE_LOCAL=${URL_MONGO_DATABASE_LOCAL}
      - URL_SERVER=${URL_SERVER}
    networks:
      - pershop_network

  api3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pershop-api-3
    ports:
      - "3889:3888"
    environment:
      - PORT_REST_FULL=3889
      - URL_MONGO_DATABASE_LOCAL=${URL_MONGO_DATABASE_LOCAL}
      - URL_SERVER=${URL_SERVER}
    networks:
      - pershop_network

  redis:
    image: redis:alpine
    container_name: pershop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pershop_network

  mongodb:
    image: mongo:latest
    container_name: pershop-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pershop_network

networks:
  pershop_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
